[project]
name = "realsense-scaner"
version = "0.1.0"
description = "Simple ChArUco-guided Intel RealSense RGB-D object scanner"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26",
  "opencv-contrib-python>=4.9",
  "open3d>=0.18",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
hardware = ["pyrealsense2>=2.55"]

[project.scripts]
rs-scan = "scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
